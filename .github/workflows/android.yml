name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-generate Android settings.gradle
        run: |
          mkdir -p react-native-app/android

          if [ ! -f "react-native-app/android/settings.gradle" ]; then
            echo "Generating clean settings.gradle..."

            cat << 'EOF' > react-native-app/android/settings.gradle
          pluginManagement {
              includeBuild("../node_modules/@react-native/gradle-plugin")
          }

          plugins {
              id("com.facebook.react.settings")
          }

          extensions.configure(com.facebook.react.ReactSettingsExtension) {
              it.autolinkLibrariesFromCommand()
          }

          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF

          else
            echo "settings.gradle already exists. Verifying ':app' and rootProject inclusion..."

            if ! grep -q "include ':app'" react-native-app/android/settings.gradle; then
              echo "include ':app'" >> react-native-app/android/settings.gradle
            fi

            if ! grep -q "rootProject.name" react-native-app/android/settings.gradle; then
              echo "rootProject.name = 'AutoPartsIndia'" >> react-native-app/android/settings.gradle
            fi
          fi

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Clean Conflicting & Duplicate Resources
        run: |
          echo "==== Step 1: Cleaning conflicting ic_launcher_background.xml files ===="

          find react-native-app/android/app/src/main/res \
            -name "ic_launcher_background.xml" \
            ! -path "*/values/*" \
            -exec rm -f {} \;

          echo "==== Step 2: Preventing duplicate asset resources ===="

          find react-native-app/android/app/src/main/res \
            -type d \
            -name "drawable-*" | while read -r dir; do

            echo "Cleaning up generated assets in $dir"

            find "$dir" \
              -type f \
              ! -name "splash_logo.png" \
              ! -name "master_logo.png" \
              ! -name "ic_notification.png" \
              -name "*.png" \
              -exec rm -f {} \;

          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable (v8.4)
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app

          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing. Auto-generating development signing key..."

            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
          else
            echo "debug.keystore is already present."
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk