name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Inject google-services.json File
        run: |
          mkdir -p react-native-app/android/app
          cat << 'EOF' > react-native-app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "firebase_url": "https://auto-parts-market-place-20312-default-rtdb.firebaseio.com",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:f4705ee3aed7aa197adf53",
                  "android_client_info": {
                    "package_name": "com.autoparts.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyBTfivYbxE7PDB7FxyAlJjFDid6LKPplx8"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Clean Conflicting Resources
        run: |
          RES_DIR="react-native-app/android/app/src/main/res"
          rm -f "$RES_DIR/values/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          find "$RES_DIR" -name "ic_launcher_background.xml" -exec rm -f {} \;

      - name: Setup App Colors
        run: |
          RES_DIR="react-native-app/android/app/src/main/res"
          mkdir -p "$RES_DIR/values"
          cat << 'EOF' > "$RES_DIR/values/colors.xml"
          <resources>
              <color name="ic_launcher_background">#8E8E93</color>
              <color name="dark_navy">#0F172A</color>
              <color name="primary_blue">#0066FF</color>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Ensure Executable Gradlew
        run: |
          cd react-native-app/android
          chmod +x gradlew || true

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          gradle assembleDebug --no-daemon -PkotlinVersion=1.9.24

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          gradle assembleRelease --no-daemon -PkotlinVersion=1.9.24

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk
