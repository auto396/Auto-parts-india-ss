name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install React Native Dependencies (Force Fresh Install)
        run: |
          cd react-native-app
          npm install react-native-safe-area-context@4.10.5 --legacy-peer-deps --save
          npm install --legacy-peer-deps

      - name: Auto-Patch Safe Area Context Directory Property if Exists
        run: |
          node -e "
          const fs = require('fs');
          const path = 'react-native-app/node_modules/react-native-safe-area-context/android/build.gradle';
          if (fs.existsSync(path)) {
            let fileContent = fs.readFileSync(path, 'utf8');
            fileContent = fileContent.replace(/\.directories/g, '.srcDirs');
            fs.writeFileSync(path, fileContent, 'utf8');
            console.log('Safe area context build.gradle successfully patched!');
          }
          "

      - name: Inject google-services.json File
        run: |
          mkdir -p react-native-app/android/app
          cat << 'EOF' > react-native-app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "firebase_url": "https://auto-parts-market-place-20312-default-rtdb.firebaseio.com",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:f4705ee3aed7aa197adf53",
                  "android_client_info": {
                    "package_name": "com.autoparts.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-oc4lurqs2fflbr5fdanlq32343if1e5k.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.autoparts.app",
                      "certificate_hash": "14d6a60e48069f67ccfaa47241797b95d9b5689a"
