name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Auto-generate Clean Android settings.gradle & Fix Kotlin/Gradle Properties
        run: |
          mkdir -p react-native-app/android
          cat << 'EOF' > react-native-app/android/settings.gradle
          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF

          # Configure memory & JVM targets in gradle.properties
          PROP_FILE="react-native-app/android/gradle.properties"
          mkdir -p react-native-app/android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> "$PROP_FILE"
          echo "kotlin.daemon.jvmargs=-Xmx2048m" >> "$PROP_FILE"
          echo "android.useAndroidX=true" >> "$PROP_FILE"
          echo "android.enableJetifier=true" >> "$PROP_FILE"

          BUILD_GRADLE="react-native-app/android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.22"/' "$BUILD_GRADLE" || true
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' "$BUILD_GRADLE" || true
          fi

          APP_BUILD_GRADLE="react-native-app/android/app/build.gradle"
          if [ -f "$APP_BUILD_GRADLE" ]; then
            cat << 'EOF' >> "$APP_BUILD_GRADLE"

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
                  freeCompilerArgs += ["-Xskip-prerelease-check", "-Xopt-in=kotlin.RequiresOptIn"]
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-reflect:1.9.22'
              }
          }
          EOF
          fi

      - name: Clean Conflicting & Duplicate Resources (BEFORE setup)
        run: |
          RES_DIR="react-native-app/android/app/src/main/res"
          echo "==== Force removing ic_launcher_background.xml files ===="
          rm -f "$RES_DIR/values/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          find "$RES_DIR" -name "ic_launcher_background.xml" -exec rm -f {} \;

          echo "==== Cleaning duplicate asset drawables ===="
          find "$RES_DIR" -type d -name "drawable-*" | while read -r dir; do
            find "$dir" -type f ! -name "splash_logo.png" ! -name "master_logo.png" ! -name "ic_notification.png" -name "*.png" -exec rm -f {} \;
          done

      - name: Setup App Colors & Silver Icon Resources
        run: |
          RES_DIR="react-native-app/android/app/src/main/res"
          mkdir -p "$RES_DIR/drawable"
          mkdir -p "$RES_DIR/values"

          cat << 'EOF' > "$RES_DIR/values/colors.xml"
          <resources>
              <color name="ic_launcher_background">#8E8E93</color>
              <color name="dark_navy">#0F172A</color>
              <color name="primary_blue">#0066FF</color>
          </resources>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2C3E50"
                  android:pathData="M54,30 A24,24 0 1,0 54,78 A24,24 0 1,0 54,30 Z M54,38 A16,16 0 1,1 54,70 A16,16 0 1,1 54,38 Z"/>
              <path
                  android:fillColor="#FF6B00"
                  android:pathData="M35,58 L42,46 C43,44 45,43 48,43 L60,43 C63,43 65,44 66,46 L73,58 C76,58 78,60 78,63 L78,68 C78,70 76,71 74,71 L73,71 C73,69 71,67 68,67 C65,67 63,69 63,71 L45,71 C45,69 43,67 40,67 C37,67 35,69 35,71 L34,71 C32,71 30,70 30,68 L30,63 C30,60 32,58 35,58 Z"/>
          </vector>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_notification.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M12,2A2,2 0 0,0 10,4A2,2 0 0,0 10,4.29C7.12,5.14 5,7.82 5,11V17L3,19V20H21V19L19,17V11C19,7.82 16.88,5.14 14,4.29A2,2 0 0,0 14,4A2,2 0 0,0 12,2Z"/>
          </vector>
          EOF

      - name: Enable BuildConfig for DateTimePicker
        run: |
          FILE="react-native-app/node_modules/@react-native-community/datetimepicker/android/build.gradle"
          if [ -f "$FILE" ]; then
            cat >> "$FILE" <<'EOF'

          android {
              buildFeatures {
                  buildConfig true
              }
          }
          EOF
          fi

      - name: Enable BuildConfig for NetInfo
        run: |
          FILE="react-native-app/node_modules/@react-native-community/netinfo/android/build.gradle"
          if [ -f "$FILE" ]; then
            cat >> "$FILE" <<'EOF'

          android {
              buildFeatures {
                  buildConfig true
              }
          }
          EOF
          fi

      - name: Enable BuildConfig for Image Picker
        run: |
          FILE="react-native-app/node_modules/react-native-image-picker/android/build.gradle"
          if [ -f "$FILE" ]; then
            cat >> "$FILE" <<'EOF'

          android {
              buildFeatures {
                  buildConfig true
              }
          }
          EOF
          fi

      - name: Fix Safe Area Context Gradle Compatibility
        run: |
          FILE="react-native-app/node_modules/react-native-safe-area-context/android/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/\.directories /\.srcDirs /g' "$FILE" || true
            sed -i 's/\.directories =/\.srcDirs =/g' "$FILE" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk
