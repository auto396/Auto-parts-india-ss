name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Bundle JS Assets
        run: |
          cd react-native-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ || true

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.3
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x createBundleReleaseJsAndAssets -x bundleReleaseJsAndAssets

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-app-apk
          path: react-native-app/android/app/build/outputs/apk/**/*.apk
