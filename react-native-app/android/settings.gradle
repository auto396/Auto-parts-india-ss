pluginManagement {
    // React Native 0.76 requires the Gradle settings plugin from the local node_modules build
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

rootProject.name = 'AutoPartsIndia'

include ':app'
project(':app').projectDir = new File(rootProject.projectDir, 'app')

apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle");
applyNativeModulesSettingsGradle(settings)

rootProject.allprojects { project ->
    if (project != rootProject) {
        project.plugins.apply("com.facebook.react")
    }
}
