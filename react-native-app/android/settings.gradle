pluginManagement {
    def reactNativeGradlePlugin = new File(rootDir, "../node_modules/@react-native/gradle-plugin")
    if (reactNativeGradlePlugin.exists()) {
        includeBuild(reactNativeGradlePlugin.absolutePath)
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

rootProject.name = 'AutoPartsIndia'

include ':app'
project(':app').projectDir = new File(rootProject.projectDir, 'app')

apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle");
applyNativeModulesSettingsGradle(settings)
